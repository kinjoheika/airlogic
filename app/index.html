<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirLogic</title>
<style>
  :root {
    --navy: #0f1d33; --navy-2: #17294a; --bg: #f4f6f9; --panel: #fff;
    --ink: #1b2435; --ink-soft: #5f6b7e; --line: #e2e7ee;
    --teal: #0f8a86; --amber: #d9961b; --amber-soft: #fdf3e1; --amber-line: #efd9a8;
    --green: #1e8a5a; --red: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Inter", "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; }
  .topnav { background: var(--navy); color: #cfd8e8; height: 56px; display: flex; align-items: stretch; padding: 0 20px; gap: 4px; position: sticky; top: 0; z-index: 5; }
  .wordmark { color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; margin-right: 22px; white-space: nowrap; }
  .wordmark span { color: var(--amber); font-weight: 800; margin-left: 4px; }
  .topnav .tab { color: #c9d3e6; font-size: 14px; }
  .topnav .tab.active { color: var(--amber); font-weight: 600; }
  .topnav .tab.active::after { background: var(--amber); }
  .tab { display: flex; align-items: center; padding: 0 12px; color: #aebbd2; font-size: 13.5px; background: none; border: 0; cursor: pointer; position: relative; font: inherit; }
  .tab.active { color: #fff; }
  .tab.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; background: var(--amber); border-radius: 3px 3px 0 0; }
  .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--ink); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.approve { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.reject { color: var(--red); border-color: #f0c9c4; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .card-hd { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
  .pad { padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--ink-soft); font-size: 12.5px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi span { display: block; color: var(--ink-soft); font-size: 12.5px; margin-bottom: 6px; }
  .kpi b { font-size: 26px; letter-spacing: -.02em; color: var(--navy-2); }
  .kpi.k-review { background: #f0f7ff; border-color: #cfe2f7; } .kpi.k-review b { color: #1d5fa8; }
  .kpi.k-warn { background: var(--amber-soft); border-color: var(--amber-line); } .kpi.k-warn b { color: #9a6410; }
  .kpi.k-ok { background: #eef9f3; border-color: #cdeedb; } .kpi.k-ok b { color: var(--green); }
  .visits .card-hd { background: #f8fafc; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .visits td { vertical-align: middle; }
  tr.click { cursor: pointer; }
  .back { color: var(--brand, #0f8a86); cursor: pointer; font-size: 13px; display: inline-block; margin-bottom: 8px; }
  .rtabs { display: flex; background: #fff; border: 1px solid var(--line, #e3e8ef); border-radius: 10px; overflow: hidden; margin: 14px 0; }
  .rtab { all: unset; cursor: pointer; padding: 12px 20px; color: #6b7587; font-weight: 600; }
  .rtab.on { color: #0f8a86; box-shadow: inset 0 -2px 0 #0f8a86; }
  .panel { background: #fff; border: 1px solid var(--line, #e3e8ef); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .panel-hd { padding: 12px 16px; border-bottom: 1px solid var(--line, #e3e8ef); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: #374151; background: #f8fafc; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 16px; padding: 16px; }
  .fld label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7587; font-weight: 700; margin-bottom: 5px; }
  .fld div { background: #f8fafc; border: 1px solid var(--line, #e3e8ef); border-radius: 8px; padding: 9px 11px; min-height: 38px; }
  .progress { display: flex; gap: 22px; flex-wrap: wrap; padding: 14px 16px; font-size: 13px; }
  .progress .ok { color: #1a7f4b; } .progress .wait { color: #7a5a00; }
  .sec2 { border-top: 3px solid #1f3a5f; }
  .count-badge { background: #fff7e0; color: #8a6d00; border: 1px solid #f1d98a; border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .sec2-foot { padding: 0 16px 14px; }
  .empty { padding: 16px; color: #6b7587; }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 900px; }
  .scroll th, .scroll td { border: 1px solid var(--line, #e3e8ef); padding: 7px 8px; text-align: center; white-space: nowrap; }
  .scroll th { background: #f8fafc; }
  .scroll td.item, .scroll th.item { text-align: left; color: #1b4f8a; font-weight: 600; }
  .scroll td.item small { display: block; color: #6b7587; font-weight: 500; }
  .scroll .std { color: #6b7587; font-size: 11px; font-weight: 600; }
  .scroll td.bad { color: #b42323; background: #fde8e8; }
  .scroll td.dash { color: #b7bec9; }
  .eq-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 10px 0 12px; }
  .eq-filters label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7587; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .eq-filters select { font: inherit; text-transform: none; letter-spacing: 0; padding: 8px 10px; border: 1px solid #dfe4ec; border-radius: 10px; background: #fff; min-width: 170px; }
  .eq-filters .link { background: none; border: 0; color: #b42323; font-weight: 600; cursor: pointer; }
  .eq-count { margin-left: auto; color: #6b7587; font-size: 12px; }
  .eq-wrap { background: #fff; border: 1px solid #dfe4ec; border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .eq-wrap .scroll { overflow: auto; max-height: 70vh; border-radius: 14px; }
  table.eq { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 12.5px; }
  table.eq th, table.eq td { padding: 9px 10px; border-bottom: 1px solid #eef1f6; white-space: nowrap; text-align: center; }
  table.eq thead th { position: sticky; top: 0; z-index: 2; }
  table.eq th.item, table.eq td.item { position: sticky; left: 0; z-index: 1; background: #fff; text-align: left; min-width: 220px; border-right: 1px solid #dfe4ec; }
  table.eq thead th.item { z-index: 3; background: #f8fafc; color: #374151; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .unit-hd { background: linear-gradient(135deg, #0f2a47, #0f5f63) !important; color: #fff; text-align: left !important; padding: 12px 14px !important; min-width: 210px; }
  .unit-name { font-weight: 700; font-size: 13px; }
  .unit-meta { font-size: 11px; opacity: .8; margin-top: 2px; }
  .sub-hd { background: #f8fafc; font-size: 10.5px; letter-spacing: .06em; color: #6b7587; font-weight: 700; }
  .sub-hd.act-hd { color: #0f8a86; }
  .std-c { color: #8a94a6; font-size: 12px; background: #fbfcfe; }
  .act-c { font-weight: 700; color: #1d2433; }
  .act-c .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #1a7f4b; margin-right: 6px; vertical-align: middle; }
  .act-c.bad { color: #b42323; background: #fde8e8; }
  .act-c.bad .dot { background: #b42323; }
  .act-c.empty { color: #b7bec9; font-weight: 400; }
  .act-c.empty .dot { display: none; }
  .item-name { font-weight: 600; color: #1b4f8a; }
  .item-unit { font-size: 11px; color: #8a94a6; }
  tr.section td { background: #f1f5fa; color: #0f2a47; font-weight: 700; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 8px 12px; position: sticky; left: 0; }
  .legend { font-size: 12px; color: #6b7587; margin: 10px 2px; }
  .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 6px 0 14px; vertical-align: middle; }
  .lg.ok { background: #1a7f4b; } .lg.bad { background: #b42323; }
  table.eq td[hidden], table.eq th[hidden] { display: none; }
  tr.click:hover td { background: #f1f7f6; }
  .ref { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: #e0f5f4; color: #0c6b68; border: 1px solid #bfe7e4; margin-right: 4px; }
  .chip.muted-chip { background: #f1f3f6; color: var(--ink-soft); border-color: var(--line); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #eef1f5; color: var(--ink-soft); white-space: nowrap; }
  .pill.t-review { background: #e6f1fc; color: #1d5fa8; }
  .pill.t-ok { background: #e4f5ec; color: var(--green); }
  .pill.t-sent { background: #fbe7e4; color: var(--red); }
  .pill.t-draft { background: var(--amber-soft); color: #9a6410; }
  .pill.t-bad { background: #fbe7e4; color: var(--red); }
  .act { font: inherit; font-size: 12.5px; font-weight: 600; background: #fff; color: var(--teal); border: 1px solid #bfe0de; border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .act:hover { background: var(--teal-soft, #e3f4f3); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .r { text-align: right; }
  .inv { padding: 0; }
  .inv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 22px; border-top: 3px solid var(--amber); }
  .inv-title { font-family: Georgia, "Times New Roman", serif; font-size: 22px; color: #7a1f2b; font-weight: 700; }
  .inv-meta { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .inv-parties { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .inv-parties > div { padding: 16px 22px; }
  .inv-parties > div + div { border-left: 1px solid var(--line); }
  .inv-parties label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: 4px; }
  .inv-total { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; background: #f8fafc; border-top: 1px solid var(--line); }
  .inv-total b { font-size: 20px; }
  @media (max-width: 760px) { .inv-parties { grid-template-columns: 1fr; } .inv-parties > div + div { border-left: 0; border-top: 1px solid var(--line); } }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid var(--line); }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef1f5; }
  .b-ok { background: #e4f5ec; color: var(--green); }
  .b-warn { background: var(--amber-soft); color: #9a6410; border: 1px solid var(--amber-line); }
  .b-bad { background: #fbe7e4; color: var(--red); }
  .muted { color: var(--ink-soft); }
  .search { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; min-width: 240px; background: #fff; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .notice { background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .login { max-width: 360px; margin: 80px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
  .login h1 { margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; font-weight: 600; }
  input, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit; background: #fff; color: var(--ink); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .hidden { display: none !important; }
  /* ---- Equipment Registry (modern) ---- */
  .page-hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-hd h1 { margin: 0 0 4px; letter-spacing: -.01em; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi-card { background: #fff; border: 1px solid #e3e8ef; border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .kpi-card span { display: block; font-size: 12px; color: #6b7587; letter-spacing: .02em; }
  .kpi-card b { display: block; font-size: 28px; margin-top: 6px; letter-spacing: -.02em; color: #0f2a47; }
  .kpi-card.k-ok b { color: #1a7f4b; } .kpi-card.k-warn b { color: #9a6b00; } .kpi-card.k-off b { color: #7a1f1f; }
  .decom { background: #fff; border: 1px solid #f1d6a5; border-radius: 14px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .decom-hd { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: #fffaf0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: #7a5a00; }
  .dot-warn { width: 8px; height: 8px; border-radius: 50%; background: #d69e2e; display: inline-block; }
  .decom-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; border-top: 1px solid #f3efe3; }
  .decom-title { font-weight: 600; }
  .decom-act { display: flex; gap: 8px; }
  .decom-act .btn { border-radius: 999px; padding: 7px 16px; }
  .list-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .list-tools .search { min-width: 320px; border-radius: 999px; padding: 9px 16px; }
  .reg-card { background: #fff; border: 1px solid #e3e8ef; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .reg-card table { min-width: 720px; }
  .reg-card th { background: #f8fafc; font-size: 11px; letter-spacing: .06em; color: #6b7587; padding: 12px 16px; position: sticky; top: 0; }
  .reg-card td { padding: 13px 16px; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
  .reg-card tbody tr:hover td { background: #f7fbfb; }
  .reg-card tr:last-child td { border-bottom: 0; }
  .reg-card .unit { font-weight: 600; color: #0f2a47; }
  .reg-card .muted { font-size: 12px; margin-top: 2px; }
  .serial { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #374151; background: #f1f4f9; padding: 2px 7px; border-radius: 6px; }
  .reg-card td.num { font-variant-numeric: tabular-nums; color: #374151; }
  .spill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
  .spill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .spill.s-ok { color: #1a7f4b; background: #e8f6ee; }
  .spill.s-warn { color: #8a5d00; background: #fdf3d8; }
  .spill.s-off { color: #7a1f1f; background: #fbe9e9; }

  .dialog-back { position: fixed; inset: 0; background: rgba(10,16,30,.45); display: grid; place-items: center; z-index: 10; }
  .dialog { background: var(--panel); border-radius: 14px; padding: 20px; width: min(460px, 92vw); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .pa { background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .pa-row { background: #fff; border: 1px solid var(--amber-line); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .group td { background: var(--navy-2); color: #fff; font-weight: 700; }
  .sub-hd td { background: #fafbfd; color: var(--teal); font-weight: 700; font-size: 12px; }
  @media (max-width: 760px) {
    .topnav { overflow-x: auto; }
    .who { display: none; }
    .search { min-width: 0; width: 100%; }
  }

  /* ---- Service Report (modern) ---- */
  .rpt-hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .rpt-hd h1 { margin: 2px 0 4px; font-size: 26px; letter-spacing: -.02em; color: #0f2a47; }
  .rpt-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #0f8a86; font-weight: 700; }
  .rpt-empty h1 { margin: 0 0 6px; }
  .ai-note { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; padding: 14px 18px; border-radius: 14px;
             background: linear-gradient(135deg, #fffbeb, #fff4cc); border: 1px solid #f1d98a; color: #6b4f00; }
  .ai-note .spark { font-size: 18px; color: #c58b00; line-height: 1.2; }
  .ai-note b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .rtabs { display: inline-flex; gap: 4px; padding: 4px; background: #eef2f7; border-radius: 12px; border: 0; margin: 4px 0 14px; }
  .rtabs .rtab { border-radius: 9px; padding: 8px 16px; border: 0; background: transparent; color: #6b7587; }
  .rtabs .rtab.on { background: #fff; color: #0f8a86; box-shadow: 0 1px 3px rgba(15,23,42,.10); }
  .sec2 .panel-hd, .panel .panel-hd { background: #fff; color: #0f2a47; font-size: 12px; letter-spacing: .08em; }
  .fld div { background: #fbfcfe; border-radius: 10px; }
  .fld label { font-size: 10.5px; }
  .progress { gap: 10px 22px; }
  .progress span { background: #f5f7fb; padding: 5px 11px; border-radius: 999px; }
  .progress .ok { background: #e8f6ee; } .progress .wait { background: #fdf3d8; }
  .count-badge { border-radius: 999px; }
  .panel { border-radius: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
  .rtabs .rtab { cursor: pointer; user-select: none; }
  .rtabs .rtab:hover { color: #0f8a86; }
  .rtabs .rtab:focus-visible { outline: 2px solid #0f8a86; outline-offset: 2px; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 4px 16px 14px; }
  .room { border: 1px solid #e3e8ef; border-radius: 12px; overflow: hidden; background: #fff; }
  .room-hd { background: #f5f7fb; padding: 9px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: #374151; border-bottom: 1px solid #e3e8ef; }
  .room-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #f0f3f8; }
  .room-row:last-child { border-bottom: 0; }
  .room-unit { font-size: 13px; font-weight: 600; color: #0f2a47; }
  .room-unit .muted { font-size: 11.5px; font-weight: 400; margin-top: 2px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn { border: 1px solid #dfe4ec; background: #fff; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; color: #374151; cursor: pointer; }
  .chip-btn span { color: #6b7587; margin-left: 6px; font-weight: 600; }
  .chip-btn:hover { border-color: #0f8a86; }
  .chip-btn.on { background: #0f8a86; border-color: #0f8a86; color: #fff; }
  .chip-btn.on span { color: #d7f0ee; }
  .btn.small { padding: 6px 12px; font-size: 12.5px; }
  .reg-card td.r { text-align: right; }
  .spill.s-info { color: #2b6cb0; background: #e8f0fb; }

<!-- LOGIN -->
<section id="login-view" class="hidden">
  <div class="login">
    <h1>AirLogic sign in</h1>
    <div class="muted" style="margin-bottom:8px">Staff accounts only.</div>
    <label>Email</label><input id="login-email" type="email" autocomplete="username">
    <label>Password</label><input id="login-pass" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button class="btn primary" id="login-btn" style="width:100%">Sign in</button></div>
    <div class="err" id="login-err"></div>
  </div>
</section>

<!-- SETUP NOTICE (shown until config.js is filled in) -->
<section id="setup-view" class="hidden">
  <main>
    <h1>Connect Supabase first</h1>
    <div class="notice">Open <b>config.js</b> and paste your Supabase project URL and anon public key. Then reload this page.</div>
  </main>
</section>

<!-- APP -->
<div id="app-view" class="hidden">
  <nav class="topnav">
    <div class="wordmark">Standard&nbsp;<span>Airlogic</span></div>
    <button class="tab" data-route="visits">Jobs</button>
    <button class="tab" data-route="equipment">Equipment</button>
    <button class="tab" data-route="report">Service Report</button>
    <button class="tab" data-route="invoices">Invoice</button>
    <div class="spacer"></div>
    <div class="who"><span id="who-name"></span> <button class="btn ghost" id="logout-btn" style="color:#fff;border-color:#2c4470">Sign out</button></div>
  </nav>
  <main id="page"></main>
</div>

<!-- DIALOG -->
<div class="dialog-back hidden" id="dialog-back">
  <div class="dialog" id="dialog"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const cfg = window.AIRLOGIC_CONFIG || {};
  const configured = cfg.supabaseUrl && !cfg.supabaseUrl.includes("YOUR-PROJECT") &&
                     cfg.supabaseAnonKey && !cfg.supabaseAnonKey.includes("YOUR-ANON");
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (d) => (d ? String(d).slice(0, 10) : "");

  function show(id) {
    ["login-view", "setup-view", "app-view"].forEach((v) => $("#" + v).classList.toggle("hidden", v !== id));
  }

  if (!configured) { show("setup-view"); return; }
  if (!window.supabase) { show("setup-view"); $("#setup-view main").innerHTML = "<h1>Could not load Supabase</h1><div class='notice'>Check your internet connection and reload.</div>"; return; }

  const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // ---------- data access (Supabase tables) ----------
  const q = {
    clients: () => db.from("clients").select("id,name,address,email,phone").order("name"),
    equipment: () => db.from("equipment").select("id,name,model,serial_number,install_year,status,client_id,sublocation_id,clients(name),sublocations(name),equipment_brands(name)").order("name"),
    visits: () => db.from("service_visits").select("id,reference,visit_date,state,sublocation,technician_name,clients(name)").order("visit_date", { ascending: false }).limit(200),
    dispatch: () => db.from("dispatch_requests").select("id,reference,urgency,state,requested_date,clients(name),dispatch_zones(name)").order("requested_date", { ascending: false }).limit(200),
    contracts: () => db.from("service_contracts").select("id,name,billing_period,price,currency,state,start_date,next_billing_date,clients(name)").order("start_date", { ascending: false }),
    parts: () => db.from("part_requests").select("id,part_name,quantity,state,created_at,service_jobs(reference)").order("created_at", { ascending: false }).limit(200),
    zones: () => db.from("dispatch_zones").select("id,name").order("sequence"),
    profile: async () => {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return null;
      const { data } = await db.from("profiles").select("full_name,role").eq("id", user.id).maybeSingle();
      return data || { full_name: user.email, role: "" };
    }
  };

  function badge(state) {
    const s = String(state || "");
    const cls = /approved|active|fulfilled|confirmed|active/i.test(s) ? "b-ok"
      : /review|pending|suggested|requested|draft|paused|rush/i.test(s) ? "b-warn"
      : /rejected|cancelled|emergency/i.test(s) ? "b-bad" : "";
    return `<span class="badge ${cls}">${esc(s.replace(/_/g, " "))}</span>`;
  }

  function table(headers, rows, empty) {
    if (!rows.length) return `<div class="pad muted">${esc(empty || "No records yet.")}</div>`;
    return `<div style="overflow-x:auto"><table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;

        <div class="card">${table(["Contract", "Client", "Period", "Price", "Start", "Next billing", "Status"],
          (data || []).map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.clients?.name)}</td><td>${esc(c.billing_period)}</td><td>${esc(c.currency)} ${esc(c.price)}</td><td>${fmtDate(c.start_date)}</td><td>${fmtDate(c.next_billing_date)}</td><td>${badge(c.state)}</td></tr>`),

      if (error) throw error;
      return `<div class="head"><div><h1>Parts requests</h1><div class="sub">Approval queue for parts and consumables</div></div></div>
        <div class="card">${table(["Part", "Qty", "Job", "Requested", "Status"],
          (data || []).map((p) => `<tr><td>${esc(p.part_name)}</td><td>${esc(p.quantity)}</td><td>${esc(p.service_jobs?.reference)}</td><td>${fmtDate(p.created_at)}</td><td>${badge(p.state)}</td></tr>`),

    async invoices() {

      const { data, error } = await db.from("invoices")
        .select("id,number,issue_date,due_date,status,clients(name)")
        .order("issue_date", { ascending: false });

        <div class="card visits"><div style="overflow-x:auto"><table>

          <tbody>${rows.length ? rows.map((i) => `<tr>
            <td><b class="ref">${esc(i.number)}</b></td><td>${esc(i.clients?.name)}</td>
            <td class="muted">${fmtDate(i.issue_date)}</td><td class="muted">${fmtDate(i.due_date)}</td>
            <td><span class="pill ${i.status === "paid" ? "t-ok" : i.status === "unpaid" ? "t-sent" : "t-draft"}">${esc(i.status)}</span></td>
            <td><button class="act" data-open-invoice="${i.id}">View →</button></td></tr>`).join("")
            : `<tr><td colspan="6" class="muted" style="padding:24px;text-align:center">No invoices yet.</td></tr>`}</tbody>
        </table></div></div>`;

    async "soon-field"() { return comingSoon("Field Entry"); },
    async "soon-pdf"() { return comingSoon("PDF Templates"); }

  function comingSoon(name) {
    return `<div class="head"><div><h1>${esc(name)}</h1><div class="sub">Coming soon</div></div></div>
      <div class="card"><div class="pad muted">This screen isn't built yet.</div></div>`;
  }

  // ---------- routing ----------
  let current = "visits";
  let openInvoiceId = null;

  async function invoiceDetail(id) {
    const [{ data: inv, error }, { data: lines }] = await Promise.all([
      db.from("invoices").select("id,number,issue_date,due_date,period_start,period_end,status,from_name,from_address,vat_reg,clients(name,address,email)").eq("id", id).single(),
      db.from("invoice_lines").select("*").eq("invoice_id", id).order("id")
    ]);
    if (error) throw error;
    const total = (lines || []).reduce((s, l) => s + Number(l.amount || 0), 0);
    const money = (n) => Number(n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const period = inv.period_start ? `${fmtDate(inv.period_start)} – ${fmtDate(inv.period_end)}` : "";
    return `
      <a class="back" data-back-invoice>← Back to all invoices</a>
      <div class="head">
        <div><h1>Invoice #${esc(inv.number)}</h1><div class="sub">${esc(inv.clients?.name)}${period ? " · " + esc(period) : ""}</div></div>
        <div class="actions"><button class="btn ghost" data-inv-print>↓ Download PDF</button> <button class="btn primary" data-inv-send>✉ Send to client</button> <button class="btn ghost" data-inv-paid="${esc(inv.id)}" ${inv.status === "paid" ? "disabled" : ""}>✔ Mark as paid</button></div>
      </div>
      <div class="inv card">
        <div class="inv-top">
          <div><div class="inv-title">Invoice #${esc(inv.number)}</div>
            <div class="inv-meta">Issue: <b>${fmtDate(inv.issue_date)}</b> &nbsp; Due: <b>${fmtDate(inv.due_date)}</b> &nbsp; Period: <b>${esc(period)}</b></div></div>
          <span class="pill ${inv.status === "paid" ? "t-ok" : inv.status === "unpaid" ? "t-sent" : "t-draft"}">${esc(inv.status)}</span>
        </div>
        <div class="inv-parties">
          <div><label>From</label><b>${esc(inv.from_name)}</b><div class="muted">${esc(inv.from_address)}</div><div class="muted">VAT Reg: ${esc(inv.vat_reg)}</div></div>
          <div><label>Bill to</label><b>${esc(inv.clients?.name)}</b><div class="muted">${esc(inv.clients?.address)}</div><div class="muted">${esc(inv.clients?.email)}</div></div>
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Service type</th><th>Equipment</th><th class="r">Visits</th><th class="r">Unit rate</th><th class="r">Subtotal (₱)</th></tr></thead>
          <tbody>${(lines || []).map((l) => `<tr><td>${esc(l.service_type)}</td><td>${esc(l.equipment_label)}</td><td class="r">${esc(l.visits)}</td><td class="r">${money(l.unit_rate)}</td><td class="r">${money(l.amount)}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="inv-total"><span>Total due</span><b>₱ ${money(total)}</b></div>
      </div>`;
  }
  async function render(route) {
    current = route;
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.route === route));
    $("#page").innerHTML = '<div class="pad muted">Loading…</div>';
    try {
      $("#page").classList.toggle("fixed-page", ["equipment", "visits"].includes(route));
      $("#page").innerHTML = await pages[route]();
      wirePage();
    } catch (err) {
      $("#page").innerHTML = `<div class="notice"><b>Could not load ${esc(route)}.</b><div class="muted" style="margin-top:6px">${esc(err.message || err)}</div><div style="margin-top:6px">Check that the tables exist and your sign-in has access (see migration/schema).</div></div>`;
    }
  }

  function wirePage() {
    const f = $("#filter");
    if (f) f.addEventListener("input", () => {
      const term = f.value.toLowerCase();
      document.querySelectorAll("#list tr[data-filter]").forEach((r) => {
        r.style.display = r.dataset.filter.toLowerCase().includes(term) ? "" : "none";
      });
    });
    document.querySelectorAll("[data-goto-invoices]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); render("invoices"); }));
    const vs = $("#visit-search");
    if (vs) {
      let chip = "all";
      const apply = () => {
        const term = vs.value.toLowerCase();
        document.querySelectorAll("#list tr[data-state]").forEach((r) => {
          r.hidden = !((chip === "all" || r.dataset.state === chip) && r.dataset.filter.toLowerCase().includes(term));
        });
      };
      vs.addEventListener("input", apply);
      document.querySelectorAll("[data-chip]").forEach((c) => c.addEventListener("click", () => {
        chip = c.dataset.chip;
        document.querySelectorAll("[data-chip]").forEach((x) => x.classList.toggle("on", x === c));
        apply();
      }));
    }
    document.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => openForm(b.dataset.add)));
    document.querySelectorAll("[data-open-invoice]").forEach((b) => b.addEventListener("click", () => { openInvoiceId = b.dataset.openInvoice; render("invoices"); }));
    document.querySelectorAll("[data-back-invoice]").forEach((b) => b.addEventListener("click", () => { openInvoiceId = null; render("invoices"); }));
    document.querySelectorAll("[data-inv-print]").forEach((b) => b.addEventListener("click", () => window.print()));
    document.querySelectorAll("[data-inv-send]").forEach((b) => b.addEventListener("click", () => alert("Email sending is not set up yet. Download the PDF and send it manually for now.")));
    document.querySelectorAll("[data-inv-paid]").forEach((b) => b.addEventListener("click", async () => {
      const { error } = await db.from("invoices").update({ status: "paid" }).eq("id", b.dataset.invPaid);
      if (error) { alert(error.message); return; }
      render("invoices");
    }));
    document.querySelectorAll("[data-decide]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.decide, b.dataset.act)));
    document.querySelectorAll("[data-visit]").forEach((r) => r.addEventListener("click", () => openReport(r.dataset.visit)));
    const ra = $("#report-area");
    if (ra) openReport(ra.dataset.first, "info", "#report-area");
  }

  // ---------- forms ----------
  function openDialog(html) { $("#dialog").innerHTML = html; $("#dialog-back").classList.remove("hidden"); }
  // ---------- service report (opened from a visit) ----------
  let reportFlash = "";
  const jobDone = (j) => (j.checklist_lines || []).length > 0 && (j.checklist_lines || []).every((c) => c.value != null);

  async function openReport(id, tab = "info", target = "#page", inspectIdx = null, unitIdx = null) {
    if (inspectIdx == null) inspState = { unit: null, page: 0 };
    const { data: v, error } = await db.from("service_visits")
      .select("id,reference,visit_date,state,sublocation,technician_name,clients(name)").eq("id", id).single();
    if (error) { $(target).innerHTML = `<div class="notice"><b>Could not open visit.</b><div class="muted">${esc(error.message)}</div></div>`; return; }
    const { data: jobs } = await db.from("service_jobs")
      .select("id, equipment(name, model, serial_number, sublocations(name), equipment_brands(name)), reading_lines(value, is_out_of_range, measurement_fields(name, unit, standard, section, sequence)), checklist_lines(id, phase, key, label, value, section, standard)")
      .eq("visit_id", id);
    const list = (jobs || []).slice().sort((x, y) =>
      (x.equipment?.sublocations?.name || "").localeCompare(y.equipment?.sublocations?.name || "") ||
      (x.equipment?.name || "").localeCompare(y.equipment?.name || ""));
    const host = $(target);
    const fromVisits = target === "#page";
    const label = String(v.state || "").replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
    const rtab = (key, text) => `<button class="rtab ${tab === key ? "on" : ""}" data-rtab="${key}">${text}</button>`;
    let body;
    try {
      if (tab === "equip") body = equipTab(list);
      else if (tab === "report") {
        const scope = unitIdx != null && list[unitIdx] ? [list[unitIdx]] : list;
        body = `<div class="back-row"><button class="link big" data-back-list>← Back to equipment checks</button></div>${ownerReport(v, scope)}`;
      }
      else if (inspectIdx != null && list[inspectIdx]) body = inspectionForm(list, inspectIdx);
      else body = checksView(v, list);
    } catch (err) {
      console.error("Report error:", err);
      body = `<div class="notice"><b>Could not show this part of the report.</b><div class="muted">${esc(err.message)}</div></div>`;
    }
    host.innerHTML = `
      ${fromVisits ? '<span class="back" data-back-visits>← Back to visits</span>' : ""}
      ${inspectIdx != null || tab === "report" ? "" : `      <div class="rpt-hd">
        <div><div class="rpt-kicker">Service report</div><h1>${esc(v.clients?.name)}</h1>
          <div class="sub">${esc(v.reference)} · ${esc(v.sublocation) || "—"} · ${fmtDate(v.visit_date)}</div></div>
        <span class="spill ${v.state === "review" ? "s-warn" : v.state === "approved" || v.state === "invoiced" ? "s-ok" : "s-off"}">${esc(label)}</span>
      </div>
`}
      ${inspectIdx != null || tab === "report" ? "" : `<div class="rtabs">${rtab("info", "Equipment checks")}${rtab("equip", "Equipment Data")}</div>`}
      ${body}`;

    const back = host.querySelector("[data-back-visits]");
    if (back) back.onclick = () => render("visits");
    host.querySelectorAll("[data-rtab]").forEach((b) => b.onclick = () => openReport(id, b.dataset.rtab, target));
    host.querySelectorAll("[data-log]").forEach((b) => b.onclick = () => openReport(id, "info", target, Number(b.dataset.log)));
    host.querySelectorAll("[data-gen-unit]").forEach((b) => b.onclick = () => openReport(id, "report", target, null, Number(b.dataset.genUnit)));
    host.querySelectorAll("[data-back-list]").forEach((b) => b.onclick = () => openReport(id, "info", target));
    if (tab === "equip") bindEquip(host);

    const gen = host.querySelector("[data-generate]");
    if (gen) gen.onclick = () => openReport(id, "report", target);
    const pv = null;
    if (pv) pv.onclick = () => {
      const pending = list.filter((j) => !jobDone(j));
      openDialog(`<h1>Report preview</h1>
        <div class="muted" style="margin-bottom:10px">${esc(v.reference)} · ${esc(v.clients?.name)} · ${fmtDate(v.visit_date)}</div>
        <p><b>${list.length - pending.length} of ${list.length}</b> units checked.</p>
        ${pending.length ? `<p>Still pending:</p><ul>${pending.map((j) => `<li>${esc(j.equipment?.name)} · ${esc(j.equipment?.sublocations?.name)}</li>`).join("")}</ul>`
          : `<p>All units are checked.</p>`}
        <p class="muted">The PDF is created after the visit is approved. Approve the visit to generate it.</p>
        <div class="row"><button class="btn ghost" id="pv-close">Close</button></div>`);
      $("#pv-close").onclick = closeDialog;
    };

    const approve = host.querySelector("[data-approve]");
    if (approve) approve.onclick = async () => {
      if (!confirm("Approve this visit?")) return;
      const { error: e } = await db.from("service_visits").update({ state: "approved" }).eq("id", id);
      if (e) { alert(e.message); return; }
      openReport(id, "info", target);
    };

    const ipages = host.querySelectorAll(".insp-page");
    if (ipages.length && inspectIdx != null) {
      if (inspState.unit !== inspectIdx) inspState = { unit: inspectIdx, page: 0 };
      const show = (k) => {
        inspState.page = k;
        ipages.forEach((el, i) => { el.hidden = i !== k; });
        host.querySelector("#insp-ind").textContent = `${ipages[k].dataset.title} · ${k + 1} of ${ipages.length}`;
        host.querySelector("#insp-prev").disabled = k === 0;
        host.querySelector("#insp-next").disabled = k === ipages.length - 1;
      };
      host.querySelector("#insp-prev").onclick = () => show(Math.max(0, inspState.page - 1));
      host.querySelector("#insp-next").onclick = () => show(Math.min(ipages.length - 1, inspState.page + 1));
      show(Math.min(inspState.page, ipages.length - 1));
    }

    const sendBtn = host.querySelector("[data-send-client]");
    if (sendBtn) sendBtn.onclick = () => alert("Email sending is not set up yet. Save the PDF and send it to the client manually for now.");
    const printBtn = host.querySelector("[data-print]");
    if (printBtn) printBtn.onclick = () => window.print();

    const save = host.querySelector("#insp-save");
    if (save) save.onclick = async () => {
      const msg = host.querySelector("#insp-msg");
      save.disabled = true;
      msg.textContent = "Saving…";
      const changes = [...host.querySelectorAll("[data-item]")]
        .map((el) => ({ id: el.dataset.item, val: el.value.trim() || null, orig: el.dataset.orig || null }))
        .filter((c) => c.val !== c.orig);
      const results = await Promise.all(changes.map((c) => db.from("checklist_lines").update({ value: c.val }).eq("id", c.id)));
      const failed = results.find((r) => r.error);
      if (failed) {
        msg.textContent = "Saving failed: " + failed.error.message + ". Your entries are kept, so you can try again.";
        save.disabled = false;
        return;
      }
      reportFlash = "Inspection saved";
      openReport(id, "info", target);
    };
  }

  function checksView(v, list) {

    const next = list.findIndex((j) => !jobDone(j));
    const rooms = new Map();
    list.forEach((j, i) => {
      const r = j.equipment?.sublocations?.name || "Unassigned";
      if (!rooms.has(r)) rooms.set(r, []);
      rooms.get(r).push(i);
    });
    const flash = reportFlash ? `<div class="flash">${esc(reportFlash)}</div>` : "";
    reportFlash = "";
    const pct = list.length ? Math.round((done / list.length) * 100) : 0;
    const roomsHtml = [...rooms.entries()].map(([name, idxs]) => `
      <section class="room-block"><h3>${esc(name)}</h3>

          const j = list[i];
          const d = jobDone(j);
          return `<div class="unit-row">
            <div class="unit-info"><div class="unit-title">${esc(j.equipment?.name)}</div>
              <div class="muted">${esc(j.equipment?.serial_number)} · ${esc(j.equipment?.equipment_brands?.name)} ${esc(j.equipment?.model)}</div></div>
            <span class="spill ${d ? "s-ok" : "s-warn"}">${d ? "Completed" : "Pending"}</span>
            <button class="btn small ${d ? "ghost" : "primary"}" data-log="${i}">${d ? "View inspection" : "Log inspection"}</button>
            <button class="btn small ghost" data-gen-unit="${i}">Generate report</button>
          </div>`;
        }).join("")}

      <div class="rpt-row">
        <section class="panel pg">
          <div class="pg-head">
            <div class="pg-counts">
              <b>Field entry progress</b>
              <span class="ok">✓ Logged: <b>${done}</b></span>
              <span class="wait">⏳ Pending: <b>${list.length - done}</b></span>
              <span>Total: <b>${list.length}</b></span>
            </div>
            <div class="pg-actions">
              ${next < 0 ? `<span class="spill s-ok">All units checked</span>` : ""}
            </div>
          </div>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="pg-list">${roomsHtml || `<div class="empty">No units on this visit yet.</div>`}</div>
        </section>
      </div>
      <section class="review-card"><h2>Review</h2>

        <div class="actions-row">
          <button class="btn ghost big" data-generate>Generate report</button>
          <button class="btn primary big" data-approve ${v.state === "review" ? "" : "disabled"}>Approve visit</button>
        </div>

  let inspState = { unit: null, page: 0 };

  function unitIssues(j) {
    const out = [];
    (j.reading_lines || []).forEach((r) => {
      if (r.is_out_of_range) out.push({ label: r.measurement_fields?.name || "Reading", value: r.value, std: r.measurement_fields?.standard });
    });
    (j.checklist_lines || []).forEach((c) => {
      if (c.value != null && c.value !== "—" && !/^(normal|no leak)$/i.test(c.value)) out.push({ label: c.label, value: c.value, std: c.standard });
    });
    return out;
  }

  function ownerReport(v, list) {
    const recorded = list.filter((j) => (j.reading_lines || []).some((r) => r.value != null) || (j.checklist_lines || []).some((c) => c.value != null));
    const status = (j) => {
      const isRec = (j.reading_lines || []).some((r) => r.value != null) || (j.checklist_lines || []).some((c) => c.value != null);
      if (!isRec) return { key: "pending", text: "Not inspected", cls: "s-off" };
      const n = unitIssues(j).length;
      if (n === 0) return { key: "good", text: "Good condition", cls: "s-ok" };
      if (n === 1) return { key: "watch", text: "Requires watch", cls: "s-warn" };
      return { key: "urgent", text: "Urgent action", cls: "s-bad" };
    };
    const st = list.map(status);
    const count = (k) => st.filter((x) => x.key === k).length;
    const approved = v.state === "approved" || v.state === "invoiced";
    const rooms = new Set(list.map((j) => j.equipment?.sublocations?.name).filter(Boolean)).size;
    const parts = [
      ["A", "Indoor PCB", "Control board inside the air handler. Manages fan speed and cooling logic. Failure stops the unit entirely."],
      ["B", "Fan, motor and capacitor", "The blower that pushes air through the duct. A worn belt or weak capacitor causes slow airflow or failure."],
      ["C", "Evaporator coil", "Indoor cooling coil. Removes heat from return air. Grease and dust buildup is the top issue in kitchens."],
      ["D", "Air filter", "Captures dust before it reaches the coil. A clogged filter cuts airflow and raises energy cost."],
      ["E", "Filter / drier", "On the liquid refrigerant line. Removes moisture and particles that would damage the compressor."],
      ["F", "Compressor, outdoor PCB and capacitor", "Heart of the refrigerant circuit. Failure means full shutdown, with the highest repair cost."],
      ["G", "Condenser coil and outdoor fan motor", "Releases heat outdoors. Dirty coils raise discharge pressure and electricity use significantly."],
    ];
    const units = list.map((j, i) => {
      const s2 = st[i];
      const issues = unitIssues(j);
      const body = s2.key === "pending"
        ? `<div class="od-muted">Not inspected yet.</div>`
        : issues.length
          ? `<ul class="od-issues">${issues.map((x) => `<li><b>${esc(x.label)}</b> — ${esc(x.value)}${x.std ? ` <span class="od-muted">(standard ${esc(x.std)})</span>` : ""}</li>`).join("")}</ul>`
          : `<div class="od-muted">All checks normal.</div>`;
      return `<div class="od-unit">
        <div class="od-unit-hd"><div><b>${esc(j.equipment?.name)}</b> <span class="od-muted">${esc(j.equipment?.sublocations?.name)} · ${esc(j.equipment?.serial_number)}</span></div>
          <span class="od-pill ${s2.key}">${esc(s2.text)}</span></div>
        ${body}
      </div>`;
    }).join("");
    return `
      <div class="owner-bar">
        <span class="muted">${approved ? "Approved — ready to save as PDF." : "The PDF is available after the visit is approved. This is the preview."}</span>
        <div class="pg-actions">
          <button class="btn ghost big" data-send-client ${approved ? "" : "disabled"}>Send to client</button>
          <button class="btn primary big" data-print ${approved ? "" : "disabled"}>Save as PDF</button>
        </div>
      </div>
      <article class="owner-doc">
        <header class="od-top">
          <div><div class="od-brand">Standard Airlogic <span>Service Co.</span></div>
            <div class="od-sub">Air Handling Unit — Owner Service Report</div></div>
          <div class="od-meta">Report No. ${esc(v.reference)}<br>Date: ${fmtDate(v.visit_date)}<br>Technician: ${esc(v.technician_name) || "—"}</div>
        </header>
        <div class="od-info">
          <div><label>Client</label><b>${esc(v.clients?.name)}</b></div>
          <div><label>Location</label><b>${esc(v.sublocation) || "—"}</b></div>
          <div><label>Units inspected</label><b>${recorded.length} of ${list.length} units</b></div>
          <div><label>Next service</label><b>—</b></div>
        </div>
        <h3 class="od-sec">Assets status — this visit</h3>
        <div class="od-status">
          <div class="od-box good"><b>${count("good")}</b><span>/ ${list.length}</span><small>Good condition</small></div>
          <div class="od-box watch"><b>${count("watch")}</b><span>/ ${list.length}</span><small>Requires watch</small></div>
          <div class="od-box urgent"><b>${count("urgent")}</b><span>/ ${list.length}</span><small>Urgent action</small></div>
          <div class="od-box pending"><b>${count("pending")}</b><span>/ ${list.length}</span><small>Not inspected</small></div>
        </div>
        <h3 class="od-sec">Parts A–G — fixed reference</h3>
        <div class="od-parts">${parts.map(([k, t, d]) => `<div class="od-part"><span>${k}</span><div><b>${esc(t)}</b><div class="od-muted">${esc(d)}</div></div></div>`).join("")}</div>
        <h3 class="od-sec">Unit-by-unit detail (${rooms} room${rooms === 1 ? "" : "s"})</h3>
        ${units || `<div class="od-muted">No units on this visit yet.</div>`}
        <div class="od-foot">Estimated repair costs and site photos are added by the technician before approval.</div>
      </article>`;
  }

  function equipTab(list) {
    if (!list.length) return `<div class="panel"><div class="empty">No equipment on this visit yet.</div></div>`;
    const units = list.map((j, i) => ({
      i, job: j,
      name: j.equipment?.name || "Unit",
      model: j.equipment?.model || "",
      serial: j.equipment?.serial_number || "",
      sub: j.equipment?.sublocations?.name || "—",
      brand: j.equipment?.equipment_brands?.name || "—",
      logged: (j.reading_lines || []).some((r) => r.value != null) || (j.checklist_lines || []).some((c) => c.value != null),
    }));
    const subs = [...new Set(units.map((u) => u.sub))];
    const brands = [...new Set(units.map((u) => u.brand))];

    // Every measurement used on this visit (all units)
    const meas = new Map();
    list.forEach((j) => (j.reading_lines || []).forEach((r) => {
      const m = r.measurement_fields;
      if (m && !meas.has(m.name)) meas.set(m.name, m);
    }));
    const measRows = [...meas.values()]
      .sort((a, b) => (a.section || "").localeCompare(b.section || "") || (a.sequence ?? 0) - (b.sequence ?? 0));

    // Every inspection item used on this visit (all units)
    const chk = new Map();
    list.forEach((j) => (j.checklist_lines || []).forEach((c) => { if (!chk.has(c.key)) chk.set(c.key, c); }));
    const chkRows = [...chk.values()].sort((a, b) => (a.phase ?? 0) - (b.phase ?? 0) || String(a.key).localeCompare(String(b.key)));

    const card = (u) => {
      const j = u.job;
      const measBody = measRows.map((m) => {
        const r = (j.reading_lines || []).find((x) => x.measurement_fields?.name === m.name);
        const st = !r ? "empty" : r.is_out_of_range ? "bad" : "ok";
        return `<tr><td class="ri-name">${esc(m.name)}<small>${esc(m.unit)}</small></td>
          <td class="std">${esc(m.standard) || "—"}</td>
          <td class="act ${st}">${r ? `<span class="dot"></span>${esc(r.value)}` : "—"}</td></tr>`;
      }).join("");
      let lastSection = null;
      const chkBody = chkRows.map((c) => {
        const r = (j.checklist_lines || []).find((x) => x.key === c.key);
        const v = r ? r.value : null;
        const st = v == null ? "empty" : (/^normal$/i.test(v) || v === "—" ? "ok" : "bad");
        const head = c.section !== lastSection ? `<tr class="u-sub"><td colspan="3">${esc(c.section)}</td></tr>` : "";
        lastSection = c.section;
        return `${head}<tr><td class="ri-name">${esc(c.label)}</td>
          <td class="std">${esc(c.standard) || "—"}</td>
          <td class="act ${st}">${v != null ? `<span class="dot"></span>${esc(v)}` : "—"}</td></tr>`;
      }).join("");
      return `<details class="u-card" open data-u="${u.i}" data-sub="${esc(u.sub)}" data-brand="${esc(u.brand)}">
        <summary class="u-head">
          <div><div class="u-name">${esc(u.name)}</div>
            <div class="u-meta">${esc(u.brand)} ${esc(u.model)} · ${esc(u.serial)} · ${esc(u.sub)}</div></div>
          <span class="spill ${u.logged ? "s-ok" : "s-warn"}">${u.logged ? "Logged" : "Pending"}</span>
        </summary>
        <div class="u-body">
          <table class="u-table">
            <thead><tr><th>Item</th><th>Standard</th><th>Actual</th></tr></thead>
            <tbody>
              ${measBody ? `<tr class="u-sec"><td colspan="3">Measurements</td></tr>${measBody}` : ""}
              ${chkBody ? `<tr class="u-sec"><td colspan="3">Inspection</td></tr>${chkBody}` : ""}
            </tbody>
          </table>
        </div>
      </details>`;
    };

    return `
      <div class="eq-filters">
        <label>Sublocation <select id="eq-sub"><option value="">All</option>${subs.map((x) => `<option>${esc(x)}</option>`).join("")}</select></label>
        <label>Brand <select id="eq-brand"><option value="">All</option>${brands.map((x) => `<option>${esc(x)}</option>`).join("")}</select></label>
        <button class="link" id="eq-clear" type="button">Clear</button>
        <span class="eq-count">${units.length} units</span>
      </div>
      <div class="u-list-wrap"><div class="u-list">${units.map(card).join("")}</div></div>
      <p class="legend"><span class="lg ok"></span>Within standard <span class="lg bad"></span>Outside standard <span class="lg"></span>Not recorded</p>`;
  }

  function bindEquip(host) {
    const sub = host.querySelector("#eq-sub");
    const brand = host.querySelector("#eq-brand");
    const clear = host.querySelector("#eq-clear");
    if (!sub || !brand) return;
    const apply = () => {
      host.querySelectorAll("[data-u]").forEach((el) => {
        el.hidden = !((!sub.value || el.dataset.sub === sub.value) && (!brand.value || el.dataset.brand === brand.value));
      });
    };
    sub.addEventListener("change", apply);
    brand.addEventListener("change", apply);
    clear.addEventListener("click", () => { sub.value = ""; brand.value = ""; apply(); });
  }
  function closeDialog() { $("#dialog-back").classList.add("hidden"); }
  $("#dialog-back").addEventListener("click", (e) => { if (e.target.id === "dialog-back") closeDialog(); });

  async function openForm(kind) {
    if (kind === "client") {
      openDialog(`<h1>New client</h1>
        <label>Name</label><input id="f-name">
        <label>Address</label><input id="f-address">
        <label>Email</label><input id="f-email" type="email">
        <label>Phone</label><input id="f-phone">
        <div class="err" id="f-err"></div>
        <div class="row"><button class="btn ghost" id="f-cancel">Cancel</button><button class="btn primary" id="f-save">Save</button></div>`);
      $("#f-cancel").onclick = closeDialog;
      $("#f-save").onclick = async () => {
        const name = $("#f-name").value.trim();
        if (!name) { $("#f-err").textContent = "Name is required."; return; }
        const { error } = await db.from("clients").insert({ name, address: $("#f-address").value, email: $("#f-email").value, phone: $("#f-phone").value });
        if (error) { $("#f-err").textContent = error.message; return; }
        closeDialog(); render("clients");
      };
    } else if (kind === "equipment") {
      const [{ data: clients }, { data: zones }] = await Promise.all([q.clients(), q.zones()]);
      const opts = (clients || []).map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
      openDialog(`<h1>Register equipment</h1>
        <label>Client</label><select id="f-client">${opts}</select>
        <label>Unit name</label><input id="f-name" placeholder="e.g. AHU-01 Lobby">
        <label>Model</label><input id="f-model">
        <label>Serial number</label><input id="f-serial">
        <label>Install year</label><input id="f-year" type="number">
        <div class="err" id="f-err"></div>
        <div class="row"><button class="btn ghost" id="f-cancel">Cancel</button><button class="btn primary" id="f-save">Save</button></div>`);
      $("#f-cancel").onclick = closeDialog;
      $("#f-save").onclick = async () => {
        const name = $("#f-name").value.trim();
        const client_id = $("#f-client").value;
        if (!name || !client_id) { $("#f-err").textContent = "Client and unit name are required."; return; }
        const { error } = await db.from("equipment").insert({
          name, client_id, model: $("#f-model").value || null, serial_number: $("#f-serial").value || null,
          install_year: $("#f-year").value ? Number($("#f-year").value) : null
        });
        if (error) { $("#f-err").textContent = error.message; return; }
        closeDialog(); render("equipment");
      };
    } else if (kind === "visit") {
      const { data: clients } = await q.clients();
      const opts = (clients || []).map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
      const today = new Date().toISOString().slice(0, 10);
      openDialog(`<h1>New visit</h1>
        <label>Client</label><select id="f-client">${opts}</select>
        <label>Visit date</label><input id="f-date" type="date" value="${today}">
        <label>Sublocation</label><input id="f-sub" placeholder="e.g. Lobby AHU">
        <label>Technician</label><input id="f-tech" placeholder="e.g. Juan dela Cruz">
        <div class="err" id="f-err"></div>
        <div class="row"><button class="btn ghost" id="f-cancel">Cancel</button><button class="btn primary" id="f-save">Save</button></div>`);
      $("#f-cancel").onclick = closeDialog;
      $("#f-save").onclick = async () => {
        const client_id = $("#f-client").value;
        const date = $("#f-date").value;
        if (!client_id || !date) { $("#f-err").textContent = "Client and visit date are required."; return; }
        const reference = "CP-" + date.replace(/-/g, "").slice(2) + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
        const { error } = await db.from("service_visits").insert({
          reference, client_id, visit_date: date, state: "draft",
          sublocation: $("#f-sub").value || null, technician_name: $("#f-tech").value || null
        });
        if (error) { $("#f-err").textContent = error.message; return; }
        closeDialog(); render("visits");
      };
    }
  }

  // Senior Technician decision on a pending decommission (status change only)
  async function decide(id, act) {
    const status = act === "approve" ? "decommissioned" : "active";
    if (!confirm(act === "approve" ? "Approve decommission for this unit?" : "Reject and keep this unit active?")) return;
    const { error } = await db.from("equipment").update({ status }).eq("id", id);
    if (error) { alert(error.message); return; }
    render(current);
  }

  // ---------- sign-in ----------
  async function enter() {
    const profile = await q.profile();
    $("#who-name").textContent = profile ? `${profile.full_name || ""}${profile.role ? " · " + profile.role.replace(/_/g, " ") : ""}` : "";
    show("app-view");
    render(current);
  }

  $("#login-btn").addEventListener("click", async () => {
    $("#login-err").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: $("#login-email").value.trim(), password: $("#login-pass").value });
    if (error) { $("#login-err").textContent = error.message; return; }
    enter();
  });
  $("#login-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#login-btn").click(); });
  $("#logout-btn").addEventListener("click", async () => { await db.auth.signOut(); show("login-view"); });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => render(t.dataset.route)));

  db.auth.getSession().then(({ data: { session } }) => {
    if (session) enter(); else show("login-view");
  });
})();
</script>
</body>
</html>
