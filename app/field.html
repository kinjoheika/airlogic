<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AirLogic Field Entry</title>
<style>
  :root { --nav:#111a2e; --navy:#0f2a47; --gold:#f0b429; --teal:#0f8a86; --ink:#1d2433; --muted:#6b7587; --line:#e3e8ef; --bg:#f3f5f9; --ok:#1a7f4b; --warn:#8a5d00; --bad:#b42323; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #dfe5ee; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 430px; height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  .top { background: var(--nav); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-weight: 800; font-size: 16px; } .brand span { color: var(--gold); }
  .brand small { display: block; font-weight: 500; font-size: 10.5px; color: #8fa3c4; letter-spacing: .04em; }
  .sync { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; background: #1f3d63; color: #d9e4f5; white-space: nowrap; }
  .sync.wait { background: #5c4300; color: #ffe9a8; } .sync.ok { background: #14452d; color: #bdf2d3; }
  .dl { background: transparent; border: 1px solid #3d5a80; color: #d9e4f5; border-radius: 8px; padding: 4px 9px; font: inherit; font-size: 11.5px; cursor: pointer; margin-left: 6px; min-height: 30px; }
  main { flex: 1; overflow-y: auto; padding: 14px 14px 90px; -webkit-overflow-scrolling: touch; }
  .hd { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .hd h1 { font-size: 18px; margin: 0; color: var(--ink); }
  .hd .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .prog .bar { flex: 1; height: 6px; background: #e8edf4; border-radius: 99px; overflow: hidden; }
  .prog .bar span { display: block; height: 100%; background: var(--teal); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .btn { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); padding: 0 12px; }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.teal { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.good { color: var(--ok); }
  .btn:disabled { opacity: .45; cursor: default; }
  .nfc { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 14px; width: 100%; border: 0; text-align: left; font: inherit; cursor: pointer; }
  .nfc .ic { width: 34px; height: 34px; border-radius: 10px; background: #2c3a52; display: grid; place-items: center; font-size: 16px; flex: none; }
  .nfc b { display: block; font-size: 14px; } .nfc small { color: #aab6cc; font-size: 12px; }
  .nfc .chev { margin-left: auto; color: #aab6cc; font-size: 18px; }
  .room { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 14px 2px 6px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  .dev { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; width: 100%; border: 0; border-bottom: 1px solid #f1f4f8; background: #fff; text-align: left; font: inherit; cursor: pointer; min-height: 60px; }
  .dev:last-child { border-bottom: 0; }
  .dev:active { background: #f1f7f6; }
  .dev .t { font-weight: 700; color: var(--ink); }
  .dev .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pill { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
  .p-pending { background: #fdf3d8; color: var(--warn); }
  .p-done { background: #e8f6ee; color: var(--ok); }
  .vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; width: 100%; border: 0; border-bottom: 1px solid #f1f4f8; background: #fff; text-align: left; font: inherit; cursor: pointer; min-height: 60px; }
  .vrow:last-child { border-bottom: 0; }
  .notice { padding: 14px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .title { font-size: 16px; font-weight: 800; margin: 2px 2px 10px; }
  .back { color: var(--teal); font-weight: 700; padding: 8px 2px; display: inline-block; min-height: 40px; background: none; border: 0; font: inherit; cursor: pointer; }
  .sec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); background: #eef2f7; padding: 8px 14px; }
  .item { padding: 12px 14px; border-bottom: 1px solid #f1f4f8; }
  .item label { display: block; font-weight: 700; color: var(--navy); margin-bottom: 2px; font-size: 13.5px; }
  .item small { color: var(--muted); font-size: 12px; display: block; margin-bottom: 6px; }
  .item input { width: 100%; min-height: 46px; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid #d5dce6; border-radius: 10px; background: #fff; }
  .msg { font-weight: 700; padding: 8px 4px; min-height: 22px; color: var(--bad); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom button { background: none; border: 0; font: inherit; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; }
  .bottom button .ic { font-size: 18px; }
  .bottom button.on { color: var(--teal); }
  .save-bar { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .login { padding: 18px; }
  .login label { display: block; font-weight: 700; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .login input { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #d5dce6; border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Standard <span>Airlogic</span><small>FIELD ENTRY</small></div>
    <div><span class="sync" id="sync">…</span><button class="dl" id="dl">Download</button></div>
  </header>
  <main id="page"><div class="notice">Loading…</div></main>
  <nav class="bottom" id="nav">
    <button data-tab="visit"><span class="ic">📋</span>Visit</button>
    <button data-tab="units"><span class="ic">📊</span>Units</button>
    <button data-tab="history"><span class="ic">🕘</span>History</button>
    <button data-tab="more"><span class="ic">🔧</span>Add/Delete</button>
  </nav>
  <div class="save-bar" id="savebar" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="field.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
