<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a47">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AirLogic Field Entry</title>
<style>
  :root { --navy:#0f2a47; --teal:#0f8a86; --ink:#1d2433; --muted:#6b7587; --line:#e3e8ef; --bg:#f4f6fa; --ok:#1a7f4b; --warn:#9a6b00; --bad:#b42323; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header.top { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header.top b { font-size: 16px; }
  header.top small { color: #9fb0cc; font-size: 11px; display: block; }
  .sync { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #1f3d63; color: #d9e4f5; white-space: nowrap; }
  .sync.wait { background: #5c4300; color: #ffe9a8; }
  .sync.ok { background: #14452d; color: #bdf2d3; }
  main { flex: 1; overflow-y: auto; padding: 12px 12px 96px; -webkit-overflow-scrolling: touch; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .card-hd { padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: #374151; background: #f8fafc; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-bottom: 1px solid #f1f4f8; min-height: 56px; width: 100%; background: #fff; border-left: 0; border-right: 0; border-top: 0; text-align: left; font: inherit; color: inherit; }
  .row:last-child { border-bottom: 0; }
  .row:active { background: #f1f7f6; }
  .row .t { font-weight: 700; color: var(--navy); }
  .row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .p-pending { background: #fdf3d8; color: var(--warn); }
  .p-done { background: #e8f6ee; color: var(--ok); }
  .room { font-size: 12px; font-weight: 700; color: var(--navy); background: #eef2f7; padding: 8px 14px; text-transform: uppercase; letter-spacing: .05em; }
  .btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .bar .btn { flex: 1; }
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--navy); background: #eef2f7; padding: 8px 14px; }
  .item { padding: 12px 14px; border-bottom: 1px solid #f1f4f8; }
  .item label { display: block; font-weight: 600; color: var(--navy); margin-bottom: 2px; }
  .item small { color: var(--muted); font-size: 12.5px; display: block; margin-bottom: 6px; }
  .item input { width: 100%; min-height: 46px; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid #d5dce6; border-radius: 10px; background: #fff; }
  .msg { color: var(--bad); font-weight: 600; padding: 8px 14px; min-height: 22px; }
  .notice { padding: 16px; color: var(--muted); }
  .login { padding: 18px; }
  .login input { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #d5dce6; border-radius: 10px; margin: 6px 0 12px; }
  .back { color: var(--teal); font-weight: 700; padding: 10px 2px; display: inline-block; min-height: 44px; }
  .title { font-size: 18px; font-weight: 800; color: var(--navy); margin: 4px 2px 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div><b>Standard <span style="color:#f0b429">Airlogic</span></b><small>Field Entry</small></div>
  <span class="sync" id="sync">…</span>
</header>
<main id="page"><div class="notice">Loading…</div></main>
<div class="bar hidden" id="bar"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="field.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
